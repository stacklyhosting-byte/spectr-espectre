name: Upstream watch

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream ESPectre tags
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = { owner: "francescopace", repo: "espectre" };
            const { data: tags } = await github.rest.repos.listTags({ ...upstream, per_page: 5 });
            const latest = tags.map((t) => t.name).join(", ") || "unknown";
            const open = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Upstream watch"`,
            });
            if (open.data.total_count > 0) {
              core.info("An upstream-watch issue is already open; skipping.");
              return;
            }
            await github.rest.issues.create({
              ...context.repo,
              title: `Upstream watch: review upstream tags (${latest})`,
              body: [
                `Latest upstream ESPectre tags: ${latest}`,
                "",
                "Review before merging. Upstream 3.x uses a different architecture (native SDK, no MQTT).",
                "This fork tracks the MQTT-based 2.x Micro-ESPectre line. See PROVENANCE.md and RELEASING.md.",
              ].join("\n"),
            });
